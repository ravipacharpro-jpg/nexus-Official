name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Newer "latest" regressed node_modules materialization on x64.
          bun-version: "1.4.0"

      - name: Install system build deps (node-pty / native modules)
        # The preinstalled Chrome apt repo often serves a stale index (Hash Sum
        # mismatch), which must not fail the whole job: our deps come from the
        # Ubuntu archives, so a partial update is fine.
        run: sudo apt-get update || true && sudo apt-get install -y build-essential python3

      # Hardlink backend fails to materialize node_modules on this bun/x64 combo.
      - name: Install dependencies
        run: bun install --backend copy

      - name: Run test matrix
        env:
          NEXUS_FULL_TESTS: "1"
        run: bash script/test-lowmem.sh

  # NOTE: the fork's full test matrix is red on main (pre-existing failures,
  # unrelated to releases). Keep it running as an informational signal but do
  # not let it block publishing the release binary.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

  build:
    name: Build & upload release binaries
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Newer "latest" regressed node_modules materialization on x64.
          bun-version: "1.4.0"

      - name: Install system build deps (node-pty / native modules / zip)
        # The preinstalled Chrome apt repo often serves a stale index (Hash Sum
        # mismatch), which must not fail the whole job: our deps come from the
        # Ubuntu archives, so a partial update is fine.
        run: sudo apt-get update || true && sudo apt-get install -y build-essential python3 zip

      # Hardlink backend fails to materialize node_modules on this bun/x64 combo.
      - name: Install dependencies
        run: bun install --backend copy

      - name: Build all targets & upload to release
        env:
          NEXUS_VERSION: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${NEXUS_VERSION#v}"
          NEXUS_VERSION="$VERSION" bun run --cwd packages/nexus script/build.ts --release
